name: Debug GitCode

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Simulate sync
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
        run: |
          REPO_NAME="final-e2e-test"
          GITCODE_URL="https://oauth2:${GITCODE_TOKEN}@gitcode.com/hd-vector/${REPO_NAME}.git"
          echo "--- git branch ---"
          git branch -a | head -5
          echo "--- set-url or add ---"
          git remote set-url gitcode "${GITCODE_URL}" 2>/dev/null || git remote add gitcode "${GITCODE_URL}"
          echo "remote url: $(git remote get-url gitcode | sed 's|//[^@]*@|//***@|')"
          echo "--- push main --force ---"
          git push gitcode main --force && echo "SYNC PUSH OK" || echo "SYNC PUSH FAIL"
