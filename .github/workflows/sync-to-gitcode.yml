name: Sync to GitCode
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
git remote set-url gitcode https://oauth2:${{ secrets.GITCODE_TOKEN }}@gitcode.com/hd-vector/${{ github.event.repository.name }}.git || git remote add gitcode https://oauth2:${{ secrets.GITCODE_TOKEN }}@gitcode.com/hd-vector/${{ github.event.repository.name }}.git
          git push gitcode main --force
